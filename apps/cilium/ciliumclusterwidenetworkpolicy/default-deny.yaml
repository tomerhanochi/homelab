---
# Default-deny ingress for every namespace except kube-system and cilium; allows are
# layered on by other policies. Egress is intentionally unrestricted for now.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - kube-system
          - cilium
  ingress: []
