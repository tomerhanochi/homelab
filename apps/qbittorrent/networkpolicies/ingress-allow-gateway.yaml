---
# Only the oauth2-proxy pod is gateway-facing; qBittorrent itself stays reachable
# only intra-namespace (from oauth2-proxy) via ingress-allow-intra-namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ingress-allow-gateway
  namespace: qbittorrent
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "4180"
              protocol: TCP
