---
# Public entrypoint for qBittorrent. Points at the oauth2-proxy Service, NOT the
# qBittorrent Service — qBittorrent is never exposed directly.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent
  namespace: qbittorrent
spec:
  parentRefs:
    - name: default
      namespace: gateway
      sectionName: qbittorrent
  hostnames:
    - qbittorrent.tomerhanochi.com
  rules:
    - backendRefs:
        - name: oauth2-proxy
          port: 4180
