---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: immich
          image: ghcr.io/immich-app/immich-server:v3.3.3
          ports:
            - name: http
              containerPort: 2283
          env:
            - name: TZ
              value: Asia/Jerusalem
            - name: IMMICH_CONFIG_FILE
              value: /config/immich.json
            - name: DB_HOSTNAME
              value: immich-database-rw.immich.svc
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: immich-database-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-database-credentials
                  key: password
            - name: DB_VECTOR_EXTENSION
              value: vectorchord
            - name: REDIS_HOSTNAME
              value: immich-redis
          volumeMounts:
            - name: photos
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
          startupProbe:
            httpGet:
              path: /api/server/ping
              port: http
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
      volumes:
        - name: photos
          persistentVolumeClaim:
            claimName: immich-photos
        - name: config
          secret:
            secretName: immich-config
