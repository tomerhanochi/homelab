---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - postgres-cluster-credentials.sops.yaml
  - postgres-cluster.yaml
  - persistentvolumes
  - persistentvolumeclaims
  - ocirepository.yaml
  - helmrelease.yaml
  - route.yaml
  - networkpolicies

secretGenerator:
  - name: immich-config
    namespace: immich
    type: Opaque
    files:
      - immich-config.yaml=config.sops.yaml
    options:
      disableNameSuffixHash: true
