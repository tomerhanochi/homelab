---
# Grants cluster-admin to members of the authentik "kubernetes-cluster-admins"
# group. The k3s apiserver runs with oidc-groups-prefix=oidc:, so the group name
# in the OIDC groups claim is seen here as "oidc:kubernetes-cluster-admins".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-kubernetes-cluster-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: Group
    name: oidc:kubernetes-cluster-admins
    apiGroup: rbac.authorization.k8s.io
