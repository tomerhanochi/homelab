---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - postgres-cluster.yaml
  - postgres-cluster-credentials.sops.yaml
  - secret.sops.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - ocirepository.yaml
  - helmrelease.yaml
  - route.yaml
  - cluster-admins-rbac.yaml
  - networkpolicies

# Blueprints are mounted into the worker from this ConfigMap and applied on
# startup (referenced by name in helmrelease.yaml -> blueprints.configMaps).
configMapGenerator:
  - name: authentik-blueprints
    namespace: authentik
    files:
      - blueprints/oidc-clients.yaml
      - blueprints/passkey-enrollment.yaml
      - blueprints/passkey-login.yaml
    options:
      disableNameSuffixHash: true

# The single source of truth for every OIDC client secret. Each client's secret is
# one encrypted file under client-secrets/ holding just the raw value; this
# generator assembles them into the authentik-oidc Secret (consumed by the
# server/worker via helmrelease envFrom, resolved in blueprints with !Env). Apps
# that also need their own client secret (forgejo, headlamp, oauth2-proxy) read the
# SAME file via ../authentik/client-secrets/<app>.sops.txt, so each secret lives in
# exactly one place. Adding a client = one new file here + one line below.
# disableNameSuffixHash keeps the envFrom ref static (kustomize can't rewrite names
# inside HelmRelease values).
secretGenerator:
  - name: authentik-oidc
    namespace: authentik
    type: Opaque
    files:
      - FORGEJO_CLIENT_SECRET=client-secrets/forgejo.sops.txt
      - HEADLAMP_CLIENT_SECRET=client-secrets/headlamp.sops.txt
      - KUBERNETES_CLIENT_SECRET=client-secrets/kubernetes.sops.txt
      - JELLYFIN_CLIENT_SECRET=client-secrets/jellyfin.sops.txt
      - KAVITA_CLIENT_SECRET=client-secrets/kavita.sops.txt
      - QBITTORRENT_CLIENT_SECRET=client-secrets/qbittorrent.sops.txt
      - FILEBROWSER_CLIENT_SECRET=client-secrets/filebrowser.sops.txt
    options:
      disableNameSuffixHash: true

labels:
  - pairs:
      app.kubernetes.io/part-of: authentik
