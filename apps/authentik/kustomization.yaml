---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - postgres-cluster.yaml
  - postgres-cluster-credentials.sops.yaml
  - secret.sops.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - ocirepository.yaml
  - helmrelease.yaml
  - route.yaml
  - cluster-admins-rbac.yaml
  - networkpolicies

# Blueprints applied on startup from this ConfigMap.
configMapGenerator:
  - name: authentik-blueprints
    namespace: authentik
    files:
      - blueprints/oidc-clients.yaml
      - blueprints/passkey-enrollment.yaml
      - blueprints/passkey-login.yaml
    options:
      disableNameSuffixHash: true

# One encrypted file per client under client-secrets/ holds just the raw secret;
# this generator assembles them into the authentik-oidc Secret. Apps that need
# their own client secret read the SAME file, so each secret lives in one place.
# disableNameSuffixHash keeps the Secret name stable for static references.
secretGenerator:
  - name: authentik-oidc
    namespace: authentik
    type: Opaque
    files:
      - FORGEJO_CLIENT_SECRET=client-secrets/forgejo.sops.txt
      - HEADLAMP_CLIENT_SECRET=client-secrets/headlamp.sops.txt
      - KUBERNETES_CLIENT_SECRET=client-secrets/kubernetes.sops.txt
      - JELLYFIN_CLIENT_SECRET=client-secrets/jellyfin.sops.txt
      - KAVITA_CLIENT_SECRET=client-secrets/kavita.sops.txt
      - QBITTORRENT_CLIENT_SECRET=client-secrets/qbittorrent.sops.txt
      - FILEBROWSER_CLIENT_SECRET=client-secrets/filebrowser.sops.txt
    options:
      disableNameSuffixHash: true

labels:
  - pairs:
      app.kubernetes.io/part-of: authentik
