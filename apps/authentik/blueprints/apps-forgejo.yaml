---
version: 1
metadata:
  name: homelab-apps-forgejo
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: forgejo
    attrs:
      client_type: confidential
      client_id: forgejo
      client_secret: !Env FORGEJO_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: https://git.tomerhanochi.com/user/oauth2/authentik/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, entitlements]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, homelab-scope-groups]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, homelab-scope-email]]
  - model: authentik_core.application
    id: application
    identifiers:
      slug: forgejo
      name: Forgejo
    attrs:
      provider: !KeyOf provider
      meta_launch_url: https://git.tomerhanochi.com
      policy_engine_mode: any
  - model: authentik_core.applicationentitlement
    id: entitlement-user
    identifiers:
      app: !KeyOf application
      name: user
  - model: authentik_core.applicationentitlement
    id: entitlement-admin
    identifiers:
      app: !KeyOf application
      name: user
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf entitlement-user
      group: !Find [authentik_core.group, [name, homelab-users]]
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf entitlement-user
      group: !Find [authentik_core.group, [name, homelab-admins]]
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf entitlement-admin
      group: !Find [authentik_core.group, [name, homelab-admins]]
  # TODO: Remove once migration to entitlements finishes
  - model: authentik_core.group
    identifiers:
      name: forgejo-users
  - model: authentik_core.group
    identifiers:
      name: forgejo-admins
