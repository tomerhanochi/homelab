---
version: 1
metadata:
  name: homelab-passkey-enrollment
entries:
  # Passkey (WebAuthn) setup. resident_key_requirement: required makes the credential
  # a discoverable (true) passkey; user_verification: required forces the biometric/PIN.
  - model: authentik_stages_authenticator_webauthn.authenticatorwebauthnstage
    state: present
    id: webauthn-setup
    identifiers:
      name: homelab-passkey-setup
    attrs:
      friendly_name: Passkey
      user_verification: required
      resident_key_requirement: required

  # Deliberately NO password field: registration is passkey-only.
  - model: authentik_stages_prompt.prompt
    state: present
    id: prompt-username
    identifiers:
      name: homelab-enroll-username
    attrs:
      field_key: username
      label: Username
      type: username
      required: true
      placeholder: Username
      order: 0
  - model: authentik_stages_prompt.prompt
    state: present
    id: prompt-name
    identifiers:
      name: homelab-enroll-name
    attrs:
      field_key: name
      label: Display name
      type: text
      required: true
      placeholder: Name
      order: 1
  - model: authentik_stages_prompt.prompt
    state: present
    id: prompt-email
    identifiers:
      name: homelab-enroll-email
    attrs:
      field_key: email
      label: Email
      type: email
      required: true
      placeholder: Email
      order: 2
  - model: authentik_stages_prompt.promptstage
    state: present
    id: prompt-stage
    identifiers:
      name: homelab-enroll-prompt
    attrs:
      fields:
        - !KeyOf prompt-username
        - !KeyOf prompt-name
        - !KeyOf prompt-email

  # User is created INACTIVE so a half-finished enrollment never leaves a usable
  # account behind — the activation policy below flips is_active only once a passkey
  # is registered. This is NOT an admin-approval gate; a completed enrollment
  # self-activates. The real authorization boundary is group membership: a freshly
  # enrolled user is in no groups, so they can reach the authentik dashboard but no
  # OIDC apps (all gate on groups) until an admin adds them. That keeps open passkey
  # registration on a public SSO safe.
  - model: authentik_stages_user_write.userwritestage
    state: present
    id: user-write
    identifiers:
      name: homelab-enroll-write
    attrs:
      user_creation_mode: always_create
      create_users_as_inactive: true

  - model: authentik_stages_user_login.userloginstage
    state: present
    id: user-login
    identifiers:
      name: homelab-enroll-login

  # Activation policy: the stage binding sets re_evaluate_policies so this fires at
  # execution time, once pending_user exists and the passkey is registered. Flips the
  # user active so userloginstage accepts them, then returns True to include the stage.
  - model: authentik_policies_expression.expressionpolicy
    state: present
    id: policy-activate
    identifiers:
      name: homelab-enroll-activate
    attrs:
      expression: |
        pending_user = request.context.get("pending_user")
        if pending_user and pending_user.pk:
            pending_user.is_active = True
            pending_user.save()
        return True

  - model: authentik_flows.flow
    state: present
    id: flow
    identifiers:
      slug: passkey-enrollment
    attrs:
      name: Passkey Enrollment
      title: Create your account
      designation: enrollment
      authentication: require_unauthenticated

  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf prompt-stage
      order: 10
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf user-write
      order: 20
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf webauthn-setup
      order: 30
  - model: authentik_flows.flowstagebinding
    state: present
    id: binding-user-login
    identifiers:
      target: !KeyOf flow
      stage: !KeyOf user-login
      order: 40
    attrs:
      # Defer policy evaluation to stage-execution: pending_user does not exist at
      # plan-build time, only after user-write runs.
      evaluate_on_plan: false
      re_evaluate_policies: true

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      policy: !KeyOf policy-activate
      target: !KeyOf binding-user-login
      order: 0

  # Wire the passkey flow as the brand's self-service enrollment flow (adds a "Sign
  # up" link). akadmin still logs in via the default password-capable flow.
  - model: authentik_brands.brand
    state: present
    identifiers:
      domain: authentik-default
    attrs:
      flow_enrollment: !KeyOf flow
