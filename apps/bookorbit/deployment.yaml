---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookorbit
  namespace: bookorbit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bookorbit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookorbit
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bookorbit
          image: ghcr.io/bookorbit/bookorbit:3.8.0
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: BOOK_DOCK_PATH
              value: /books
            - name: APP_URL
              value: https://books.tomerhanochi.com
            - name: CLIENT_URL
              value: https://books.tomerhanochi.com
            - name: POSTGRES_HOST
              value: bookorbit-database-rw
            - name: POSTGRES_USER
              value: bookorbit
            - name: POSTGRES_DB
              value: bookorbit
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookorbit-database-credentials
                  key: password
            - name: OIDC_ALLOW_LOCAL_ISSUERS
              value: "true"
          envFrom:
            - secretRef:
                name: bookorbit-secrets
          volumeMounts:
            - name: data
              mountPath: /data
            - name: books
              mountPath: /books
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bookorbit-data
        - name: books
          persistentVolumeClaim:
            claimName: bookorbit-books
            readOnly: true
        - name: tmp
          emptyDir: {}
