---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookorbit
  namespace: bookorbit
spec:
  parentRefs:
    - name: default
      namespace: gateway
      sectionName: bookorbit
  hostnames:
    - books.homelab.tomerhanochi.com
  rules:
    - backendRefs:
        - name: bookorbit
          port: 3000
