---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bookorbit-database
  namespace: bookorbit
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  storage:
    size: 10Gi
  monitoring:
    enablePodMonitor: false
  postgresql:
    extensions:
      - name: pgvector
        image:
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.7-202611091304-18-trixie
  bootstrap:
    initdb:
      database: bookorbit
      owner: bookorbit
      secret:
        name: bookorbit-database-credentials
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        - CREATE EXTENSION IF NOT EXISTS pg_trgm;
        - CREATE EXTENSION IF NOT EXISTS unaccent;
        - CREATE EXTENSION IF NOT EXISTS vector;
