---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - persistentvolumes
  - persistentvolumeclaims
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - oauth2-proxy-helmrepository.yaml
  - oauth2-proxy-helmrelease.yaml
  - route.yaml
  - networkpolicies

secretGenerator:
  # Replace the encrypted placeholder values with the Soulseek account
  # credentials. The generated name hash rolls the Deployment after changes.
  - name: slskd-soulseek
    namespace: slskd
    files:
      - username=soulseek-username.sops.txt
      - password=soulseek-password.sops.txt
  - name: slskd-oauth2
    namespace: slskd
    type: Opaque
    literals:
      - client-id=slskd
    files:
      - client-secret=../authentik/client-secrets/slskd.sops.txt
      - cookie-secret=oauth2-cookie-secret.sops.txt
    options:
      disableNameSuffixHash: true

labels:
  - pairs:
      app.kubernetes.io/part-of: slskd
