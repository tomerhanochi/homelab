---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wealthfolio
  namespace: wealthfolio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wealthfolio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wealthfolio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wealthfolio
          image: ghcr.io/wealthfolio/wealthfolio:3.10.0
          ports:
            - name: http
              containerPort: 8088
          env:
            - name: WF_LISTEN_ADDR
              value: 0.0.0.0:8088
            - name: WF_DB_PATH
              value: /data/wealthfolio.db
            - name: WF_AUTH_REQUIRED
              value: "false"
            - name: WF_CORS_ALLOW_ORIGINS
              value: https://wealth.tomerhanochi.com
            - name: WF_OIDC_ISSUER_URL
              value: https://sso.tomerhanochi.com/application/o/wealthfolio/
            - name: WF_OIDC_CLIENT_ID
              value: wealthfolio
            - name: WF_OIDC_REDIRECT_URL
              value: https://wealth.tomerhanochi.com/api/v1/auth/oidc/callback
            - name: WF_OIDC_SCOPES
              value: openid email profile
            - name: WF_OIDC_ALLOW_ANY
              value: "true"
            - name: WF_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: wealthfolio-secrets
                  key: WF_SECRET_KEY
            - name: WF_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wealthfolio-secrets
                  key: WF_OIDC_CLIENT_SECRET
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wealthfolio-data
        - name: tmp
          emptyDir: {}
