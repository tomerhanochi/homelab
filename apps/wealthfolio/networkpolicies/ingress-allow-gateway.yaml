---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ingress-allow-gateway
  namespace: wealthfolio
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: wealthfolio
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8088"
              protocol: TCP
