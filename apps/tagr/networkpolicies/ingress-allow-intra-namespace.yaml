---
# Only same-namespace pods (including oauth2-proxy) can reach Tagr.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ingress-allow-intra-namespace
  namespace: tagr
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tagr
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tagr
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
