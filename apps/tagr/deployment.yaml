---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tagr
  namespace: tagr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tagr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tagr
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: tagr
          image: ghcr.io/wow-signal-dev/metadata-remote:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          ports:
            - name: http
              containerPort: 8338
          volumeMounts:
            - name: music
              mountPath: /music
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: music
          persistentVolumeClaim:
            claimName: tagr-music
