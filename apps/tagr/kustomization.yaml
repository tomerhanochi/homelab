---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - persistentvolumes
  - persistentvolumeclaims
  - deployment.yaml
  - service.yaml
  - oauth2-proxy
  - route.yaml
  - networkpolicies

secretGenerator:
  - name: tagr-config
    namespace: tagr
    type: Opaque
    envs:
      - tagr-config.sops.txt
    options:
      disableNameSuffixHash: true

labels:
  - pairs:
      app.kubernetes.io/part-of: tagr
