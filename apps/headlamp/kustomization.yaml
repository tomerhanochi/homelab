---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - route.yaml
  - networkpolicies

# Headlamp's OIDC secret. Only OIDC_CLIENT_SECRET is secret (shared with authentik,
# single source of truth, SOPS-encrypted); the rest are non-secret literals.
# OIDC_SCOPES is comma-separated.
secretGenerator:
  - name: headlamp-oidc
    namespace: headlamp
    type: Opaque
    literals:
      - OIDC_CLIENT_ID=headlamp
      - OIDC_ISSUER_URL=https://sso.tomerhanochi.com/application/o/headlamp/
      - OIDC_SCOPES=openid,profile,email,groups,offline_access
    files:
      - OIDC_CLIENT_SECRET=../authentik/client-secrets/headlamp.sops.txt
    options:
      disableNameSuffixHash: true

labels:
  - pairs:
      app.kubernetes.io/part-of: headlamp
