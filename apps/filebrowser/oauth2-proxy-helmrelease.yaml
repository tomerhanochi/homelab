---
# oauth2-proxy fronting filebrowser. Authenticates against authentik via OIDC, then
# proxies to the internal filebrowser Service, injecting X-Auth-Request-User (which
# filebrowser trusts via proxy-header auth). Release name is "oauth2-proxy" so the
# chart's fullname (and the Service the HTTPRoute targets) is exactly "oauth2-proxy".
#
# Temporary shim until Cilium 1.20 native forward-auth; delete this app's oauth2-*
# files + route + gateway listener + blueprint entry to rip it out.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oauth2-proxy
  namespace: filebrowser
spec:
  interval: 30m
  chart:
    spec:
      chart: oauth2-proxy
      version: 10.7.0
      sourceRef:
        kind: HelmRepository
        name: oauth2-proxy
  values:
    replicaCount: 1

    # Pin the digest through the tag (chart has no image.digest field).
    image:
      registry: quay.io
      repository: oauth2-proxy/oauth2-proxy
      tag: v7.15.3@sha256:10a1165743a192e1940b4708fb9647027185ce11a681a1c5519b442ff7f1f561  # yamllint disable-line rule:line-length

    config:
      # client-id / client-secret / cookie-secret come from this SOPS-encrypted
      # secret. client-secret must equal FILEBROWSER_CLIENT_SECRET in authentik-oidc.
      existingSecret: filebrowser-oauth2
      # Full proxy config (replaces the chart's default cfg). Credentials are
      # injected from existingSecret as env, so they are not repeated here.
      configFile: |-
        provider = "oidc"
        oidc_issuer_url = "https://sso.tomerhanochi.com/application/o/filebrowser/"
        redirect_url = "https://files.tomerhanochi.com/oauth2/callback"
        upstreams = [ "http://filebrowser.filebrowser.svc:8080" ]
        scope = "openid profile email groups"
        allowed_groups = [ "filebrowser-users" ]
        email_domains = [ "*" ]
        cookie_secure = true
        skip_provider_button = true
        reverse_proxy = true
        set_xauthrequest = true

    service:
      type: ClusterIP
      # Matches the HTTPRoute backendRef port and the container's 4180.
      portNumber: 4180

    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault

    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
