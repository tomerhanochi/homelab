---
# Public entrypoint for filebrowser. Points at the oauth2-proxy Service, NOT
# filebrowser — filebrowser is never exposed directly (it trusts the auth header).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: filebrowser
  namespace: filebrowser
spec:
  parentRefs:
    - name: default
      namespace: gateway
      sectionName: filebrowser
  hostnames:
    - files.tomerhanochi.com
  rules:
    - backendRefs:
        - name: oauth2-proxy
          port: 4180
