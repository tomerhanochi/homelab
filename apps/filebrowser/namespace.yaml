---
apiVersion: v1
kind: Namespace
metadata:
  name: filebrowser
  labels:
    inject-ca-bundle: "true"
    # filebrowser + oauth2-proxy both run rootless, so this namespace is
    # restricted (unlike qbittorrent, which needs privileged for gluetun).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
