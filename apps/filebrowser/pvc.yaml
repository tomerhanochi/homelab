---
# filebrowser's own state (the SQLite database). Kept on its own volume so it is
# never exposed in the file UI.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filebrowser-config
  namespace: filebrowser
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
