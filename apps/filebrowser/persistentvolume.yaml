---
# Statically-provisioned hostPath PV (not `local`): kubelet relabels `local`
# volumes, which fails on the exfat `context=` mount (no xattrs). hostPath is
# never relabeled and stays restricted-PSA compliant (PSA only checks the pod).
# Mounts the WHOLE /var/mnt/data tree (not just media) so filebrowser can move a
# finished download into the media library as an instant same-filesystem rename.
# Host dir must be owned by 1000:1000.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: filebrowser-data
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/mnt/data
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - control-plane
