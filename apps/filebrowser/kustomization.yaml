---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - persistentvolume.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - oauth2-proxy-helmrepository.yaml
  - oauth2-proxy-helmrelease.yaml
  - route.yaml
  - networkpolicies

# oauth2-proxy credentials. client-id is a non-secret literal; client-secret is
# shared with authentik (single source of truth) and cookie-secret is app-local,
# both SOPS-encrypted and decrypted by Flux before build. disableNameSuffixHash
# keeps the name static so the HelmRelease's config.existingSecret ref stays valid.
# NOTE: the cross-directory file ref requires kustomize LoadRestrictionsNone, which
# Flux's kustomize-controller uses by default.
secretGenerator:
  - name: filebrowser-oauth2
    namespace: filebrowser
    type: Opaque
    literals:
      - client-id=filebrowser
    files:
      - client-secret=../authentik/client-secrets/filebrowser.sops.txt
      - cookie-secret=oauth2-cookie-secret.sops.txt
    options:
      disableNameSuffixHash: true

labels:
  - pairs:
      app.kubernetes.io/part-of: filebrowser
