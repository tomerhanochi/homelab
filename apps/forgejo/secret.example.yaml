# TEMPLATE ONLY — this file documents secret shapes and is not referenced by kustomization.
# Database credentials are SOPS-encrypted in database/; OIDC credentials are generated.
---
# CloudNativePG credentials for the forgejo-database cluster owner.
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-database-credentials
  namespace: forgejo
type: kubernetes.io/basic-auth
stringData:
  username: forgejo
  password: REPLACE_WITH_RANDOM_PASSWORD
---
# OIDC client credentials for the authentik "forgejo" provider.
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-oauth
  namespace: forgejo
type: Opaque
stringData:
  key: forgejo
  secret: REPLACE_WITH_OIDC_CLIENT_SECRET
