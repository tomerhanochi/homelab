---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - postgres-cluster.yaml
  - postgres-cluster-credentials.sops.yaml
  - ocirepository.yaml
  - helmrelease.yaml
  - route.yaml
  - ssh-route.yaml
  - networkpolicies

# Forgejo's OIDC secret. `key` is a non-secret literal client id; `secret` is the
# client secret, shared with authentik (single source of truth) and SOPS-encrypted.
# disableNameSuffixHash keeps the name static for the HelmRelease's existingSecret ref.
secretGenerator:
  - name: forgejo-oauth
    namespace: forgejo
    type: Opaque
    literals:
      - key=forgejo
    files:
      - secret=../authentik/client-secrets/forgejo.sops.txt
    options:
      disableNameSuffixHash: true

labels:
  - pairs:
      app.kubernetes.io/part-of: forgejo
