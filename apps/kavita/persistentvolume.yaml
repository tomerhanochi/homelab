---
# Statically-provisioned hostPath PV (not `local`): kubelet relabels `local`
# volumes, which fails on the exfat `context=` mount (no xattrs). hostPath is
# never relabeled and stays restricted-PSA compliant (PSA only checks the pod).
# Read-only view of the clean library. Host dir must be owned by 1000:1000.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kavita-library
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  # Empty storageClassName + explicit claim binding keeps the default local-path
  # provisioner from touching this volume.
  storageClassName: ""
  hostPath:
    path: /var/mnt/data/media
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - control-plane
