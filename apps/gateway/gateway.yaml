---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: default
  namespace: gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  gatewayClassName: cilium
  listeners:
    - name: authentik
      hostname: sso.tomerhanochi.com
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: authentik-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
    # jellyfin and seerr both live in the consolidated `media` namespace and are
    # the only media apps exposed via the gateway from there. qBittorrent and
    # filebrowser are exposed via their own namespaces, each fronted by an
    # oauth2-proxy that authenticates against authentik (Cilium Gateway has no
    # forward-auth on stable; revisit when upgrading to Cilium 1.20).
    - name: jellyfin
      hostname: jellyfin.tomerhanochi.com
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: jellyfin-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: media
    - name: seerr
      hostname: seerr.tomerhanochi.com
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: seerr-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: media
    - name: forgejo
      hostname: git.tomerhanochi.com
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: forgejo-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
    # Raw TCP for forgejo git-over-SSH (git clone ssh://git@git.tomerhanochi.com).
    - name: forgejo-ssh
      protocol: TCP
      port: 22
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo
    - name: kavita
      hostname: kavita.tomerhanochi.com
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: kavita-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: kavita
    - name: headlamp
      hostname: headlamp.tomerhanochi.com
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: headlamp-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: headlamp
    # Routes to the oauth2-proxy in the qbittorrent namespace, not qBittorrent.
    - name: qbittorrent
      hostname: qbittorrent.tomerhanochi.com
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: qbittorrent-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: qbittorrent
    # Routes to the oauth2-proxy in the filebrowser namespace, not filebrowser.
    - name: filebrowser
      hostname: files.tomerhanochi.com
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: filebrowser-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: filebrowser
